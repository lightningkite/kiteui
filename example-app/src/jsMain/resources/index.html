<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>JS Client</title>
    <base href="/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/experimental.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/kotlin.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <style>
        /* http://meyerweb.com/eric/tools/css/reset/
   v2.0 | 20110126
   License: none (public domain)
*/

        html, body, div, span, applet, object, iframe,
        h1, h2, h3, h4, h5, h6, p, blockquote, pre,
        a, abbr, acronym, address, big, cite, code,
        del, dfn, em, img, ins, kbd, q, s, samp,
        small, strike, strong, sub, sup, tt, var,
        b, u, i, center,
        dl, dt, dd, ol, ul, li,
        fieldset, form, label, legend,
        table, caption, tbody, tfoot, thead, tr, th, td,
        article, aside, canvas, details, embed,
        figure, figcaption, footer, header, hgroup,
        menu, nav, output, ruby, section, summary,
        time, mark, audio, video {
            margin: 0;
            padding: 0;
            border: 0;
            font-size: 100%;
            font: inherit;
            vertical-align: baseline;
        }

        /* HTML5 display-role reset for older browsers */
        article, aside, details, figcaption, figure,
        footer, header, hgroup, menu, nav, section {
            display: block;
        }

        body {
            line-height: 1;
        }

        ol, ul {
            list-style: none;
        }

        blockquote, q {
            quotes: none;
        }

        blockquote:before, blockquote:after,
        q:before, q:after {
            content: '';
            content: none;
        }

        table {
            border-collapse: collapse;
            border-spacing: 0;
        }


        div[markdown-container="true"] h1 {
            font-size: 2em !important;
            font-weight: bold !important;
            margin-top: 0.67em !important;
            margin-bottom: 0.67em !important;
        }

        div[markdown-container="true"] h2 {
            font-size: 1.5em !important;
            font-weight: bold !important;
            margin-top: 0.83em !important;
            margin-bottom: 0.83em !important;
        }

        div[markdown-container="true"] h3 {
            font-size: 1.17em !important;
            font-weight: bold !important;
            margin-top: 1em !important;
            margin-bottom: 1em !important;
        }

        div[markdown-container="true"] em {
            font-style: italic !important;
        }

        div[markdown-container="true"] strong {
            font-weight: bold !important;
        }

        div[markdown-container="true"] sup {
            vertical-align: super !important;
            font-size: 75% !important;
            line-height: 0 !important;
        }

        div[markdown-container="true"] sub {
            vertical-align: sub !important;
            font-size: 75% !important;
            line-height: 0 !important;
        }

        div[markdown-container="true"] p[contenteditable="true"]:focus {
            outline: none;
        }

        div[markdown-container="true"] p[contenteditable]:empty::before {
            content: attr(data-placeholder);
            color: #888;
            font-style: italic;
            pointer-events: none;
            display: block; /* Ensures proper rendering in Firefox */
        }

        div[markdown-container="true"] p[contenteditable="true"]:focus-visible {
            outline: none;
        }

        div[markdown-container="true"] ul {
            margin-left: 2rem !important;
            list-style-type: disc;
        }

        div[markdown-container="true"] ol {
            margin-left: 2rem !important;
            list-style-type: decimal;
        }

        div[markdown-container="true"] li {
            display: list-item;
        }

        div[markdown-container="true"] code,
        div[markdown-container="true"] pre {
            background: color-mix(in srgb, currentColor 20%, transparent) !important;
            font-family: "Fira Code", "Courier New", Courier, monospace;
            padding: 0 !important; /* Adjust if you want padding inside your pre blocks */
            border: none !important;
            border-radius: 4px;
        }

        /* 2. Override the code tag ONLY when it is inside a pre block */
        div[markdown-container="true"] pre code {
            background: transparent !important; /* Removes the double-dark effect */
            padding: 0 !important;
            border-radius: 0;
        }



    </style>


</head>
<body>
<script src="/version.js"></script>
<script src="/kiteui-example-app.mjs" type="module"></script>
<!--<script src="/example-app.js"></script>-->
<script>hljs.highlightAll();</script>
</body>
</html>
